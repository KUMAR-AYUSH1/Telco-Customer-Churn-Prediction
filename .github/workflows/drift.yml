name: DRIFT IN DATA AND MODEL CHECK

on:
    push:
        branches:
            - main

    pull_request:

    workflow_dispatch:

jobs:
    drift:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip

                  if [ -f test_requirements.txt ]; then
                    pip install -r test_requirements.txt
                  fi

                  pip install jupyter nbconvert ipykernel

            - name: Execute try.ipynb
              run: |
                  jupyter nbconvert \
                    --to notebook \
                    --execute try.ipynb \
                    --output executed_try.ipynb \
                    --ExecutePreprocessor.timeout=600

            - name: Upload Executed Notebook
              uses: actions/upload-artifact@v4
              with:
                  name: executed-notebook
                  path: executed_try.ipynb

            - name: PR Comment
              if: github.event_name == 'pull_request'
              uses: mshick/add-pr-comment@v2
              with:
                  message: |
                      ## 📊 Drift Monitoring Results

                      ✅ try.ipynb executed successfully.

                      Download the executed notebook from the workflow artifacts.
