name: DRIFT IN DATA AND MODEL CHECK

on:
    push:
        branches:
            - main

    pull_request:

    workflow_dispatch:

jobs:
    drift:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip

                  if [ -f test_requirements.txt ]; then
                    pip install -r test_requirements.txt
                  fi

                  pip install jupyter nbconvert ipykernel

            - name: Create Output Folder
              run: mkdir executed_notebooks

            - name: Run drift.ipynb
              run: |
                  jupyter nbconvert \
                    --to notebook \
                    --execute drift.ipynb \
                    --output executed_drift.ipynb \
                    --output-dir executed_notebooks \
                    --ExecutePreprocessor.timeout=600

            - name: Run try.ipynb
              run: |
                  jupyter nbconvert \
                    --to notebook \
                    --execute try.ipynb \
                    --output executed_try.ipynb \
                    --output-dir executed_notebooks \
                    --ExecutePreprocessor.timeout=600

            - name: Upload Executed Notebooks
              uses: actions/upload-artifact@v4
              with:
                  name: executed-notebooks
                  path: executed_notebooks/

            - name: PR Comment
              if: github.event_name == 'pull_request'
              uses: mshick/add-pr-comment@v2
              with:
                  message: |
                      ## 📊 Drift Monitoring Results

                      ✅ Notebook execution completed successfully.

                      Executed notebooks were generated and uploaded as workflow artifacts.

                      Included notebooks:
                      - drift.ipynb
                      - try.ipynb

                      Check the **Artifacts** section in this workflow run to download results.
